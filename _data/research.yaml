- id: attribution
  cls: attribution
  tint: '#1f6fa8'
  image: /assets/images/water.jpg
  kicker: Attribution × risk
  title: Impact Attribution
  text: Using observations, large climate-model ensembles and counterfactual worlds to attribute changing hazards and health impacts to climate change.
- id: forecasting
  cls: forecasting
  tint: '#2f7d5b'
  image: /assets/images/systems.jpg
  kicker: Forecasting × resilience
  title: Weather-Health Forecasting
  text: Connecting weather forecasts with health-impact models to anticipate demand, test plausible extremes and support preparedness across public and health services.
- id: geoai
  cls: geoai
  tint: '#8a5a9e'
  image: /assets/images/heat.jpg
  kicker: Data × environment
  title: GeoAI & the Environment
  text: Placeholder. Machine learning, graph models and geospatial data to find who is at risk from environmental hazards, where and when.
