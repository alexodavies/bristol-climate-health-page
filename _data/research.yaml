# The group's three research themes (these also appear on the landing page).
# Each theme has an `id`. Projects list the theme ids they belong to (in each file in _projects); links appear on both pages automatically.
- id: attribution
  cls: attribution
  tint: '#1f6fa8'
  image: /assets/images/water.jpg
  kicker: Adaptation × Risk
  title: Impact Attribution
  text: Using observations, large climate model ensembles and counterfactual worlds, to attribute changes in climate, extreme events and their impacts to human-induced climate change and other anthropogenic and natural sources.
- id: forecasting
  cls: forecasting
  tint: '#2f7d5b'
  image: /assets/images/systems.jpg
  kicker: Forecasting × Resilience
  title: Extreme Weather & Health
  text: Connecting near real-time observations, weather forecasts and large climate model ensembles with health models, to quantify impacts of past extreme events and anticipate future impacts and demand on public services.
- id: geoai
  cls: geoai
  tint: '#f79f60' #'#8a5a9e'
  image: /assets/images/ai-heat-hero.png  #/assets/images/heat.jpg
  kicker: Modelling × Uncertainty
  title: GeoAI & Climate
  text: Developing machine learning methods to downscale climate simulations and foundation models to learn patterns about the environment and society, to answer complex questions about current and future changes and their uncertainty.
