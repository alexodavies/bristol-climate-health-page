<div class="pub-filter">
  <label for="pub-filter">Show</label>
  <select id="pub-filter">
    <option value="all">All publications</option>
    <option value="first">First author</option>
    <option value="top2">First or second author</option>
    <option value="top3">First, second or third author</option>
    <option value="last">Last author</option>
    <option value="firstlast">First or last author</option>
  </select>
  <span class="pub-count" aria-live="polite"></span>
</div>
