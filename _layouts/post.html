---
layout: default
---
<section class="page-hero">
  <p class="eyebrow">{{ page.tag | default: "Blog" }} · {{ page.date | date: "%-d %B %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.author %}<p class="dek">{% include byline.html slug=page.author %}</p>{% endif %}
</section>
<section class="page-body prose reveal">
{{ content }}
{% if page.paper %}<p><a class="text-link" href="https://doi.org/{{ page.paper }}">Read the paper ↗</a></p>{% endif %}
<a class="text-link" href="{{ '/blog/' | relative_url }}">← All posts</a>
</section>
