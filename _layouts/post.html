---
layout: default
---
<section class="page-hero">
  <p class="eyebrow">{{ page.tag | default: "Blog" }} · {{ page.date | date: "%-d %B %Y" }}</p>
  <h1>{{ page.title }}</h1>
</section>
<section class="page-body prose reveal">
{{ content }}
<a class="text-link" href="{{ '/blog/' | relative_url }}">← All posts</a>
</section>
