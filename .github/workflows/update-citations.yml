name: Update citations
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python scripts/fetch_citations.py
      - name: Commit changes and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _data/citations.yaml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update citations from ORCID"
          git push
          # pushes made with GITHUB_TOKEN do not trigger other workflows, so redeploy explicitly
          gh workflow run pages.yml
